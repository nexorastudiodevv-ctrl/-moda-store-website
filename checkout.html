<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إتمام الدفع - Moda Store</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .checkout-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #eee;
        border-radius: 4px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .form-group input, .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background-color: var(--bg-color);
        color: var(--primary-color);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <button class="menu-toggle">☰</button>
        <div class="logo">MODA</div>
        <div class="header-actions">
          <a href="wishlist.html" class="icon-btn">❤ <span id="wishlist-count">0</span></a>
          <a href="cart.html" class="icon-btn cart-icon-btn">
            🛒 <span id="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Side Menu -->
    <div class="side-menu-overlay"></div>
    <div class="side-menu">
      <button class="close-menu">✕</button>
      <a href="index.html">🏠 الرئيسية</a>
      <a href="products.html">👕 كل المنتجات</a>
      <a href="products.html#mens-section">👨 قسم الرجال</a>
      <a href="products.html#womens-section">👩 قسم النساء</a>
      <a href="products.html?filter=new">✨ وصل حديثاً</a>
      <a href="#">🔥 التخفيضات</a>
      <a href="wishlist.html">❤ قائمة الأمنيات</a>
      <a href="#">📞 تواصل معنا</a>
    </div>

    <main class="container">
      <div class="checkout-container">
        <h2 class="section-title">بيانات الشحن والدفع</h2>
        <form id="checkout-form">
          <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" id="customer-name" placeholder="أدخل اسمك الثلاثي" required />
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="customer-phone" placeholder="01xxxxxxxxx" required />
          </div>
          <div class="form-group">
            <label>المحافظة</label>
            <select id="customer-governorate" required>
              <option value="" disabled selected>اختر المحافظة</option>
              <option value="cairo">القاهرة (30 ج.م)</option>
              <option value="giza">الجيزة (35 ج.م)</option>
              <option value="alex">الإسكندرية (50 ج.م)</option>
              <option value="others">باقي المحافظات (70 ج.م)</option>
            </select>
          </div>
          <div class="form-group">
            <label>العنوان بالتفصيل</label>
            <input
              type="text"
              id="customer-address"
              placeholder="المحافظة، المدينة، الشارع"
              required
            />
          </div>
          <div id="order-summary" style="margin: 20px 0; padding: 15px; background: var(--bg-light); border-radius: 4px;">
            <p>المجموع الفرعي: <span id="subtotal-amount">0</span> جنيه</p>
            <p>تكلفة الشحن: <span id="shipping-amount">0</span> جنيه</p>
            <hr style="margin: 10px 0; border: 0; border-top: 1px solid var(--border-color);">
            <p><strong>الإجمالي الكلي: <span id="final-total-amount">0</span> جنيه</strong></p>
          </div>
          <button type="submit" class="btn" style="width: 100%">
            تأكيد الطلب
          </button>
        </form>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <div class="social-links">
          <a href="#" target="_blank" title="فيسبوك"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a href="#" target="_blank" title="إنستغرام"
            ><i class="fab fa-instagram"></i
          ></a>
          <a href="#" target="_blank" title="تويتر"
            ><i class="fab fa-twitter"></i
          ></a>
          <a href="#" target="_blank" title="واتساب"
            ><i class="fab fa-whatsapp"></i
          ></a>
        </div>
        <p>جميع الحقوق محفوظة © 2026</p>
      </div>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
