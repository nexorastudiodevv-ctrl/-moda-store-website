<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>إتمام الدفع - Moda Store</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .checkout-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #eee;
        border-radius: 4px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <button class="menu-toggle">☰</button>
        <div class="logo">MODA</div>
      </div>
    </header>

    <!-- Side Menu -->
    <div class="side-menu-overlay"></div>
    <div class="side-menu">
      <button class="close-menu">✕</button>
      <a href="index.html">🏠 الرئيسية</a>
      <a href="products.html">👕 كل المنتجات</a>
      <a href="products.html#mens-section">👨 قسم الرجال</a>
      <a href="products.html#womens-section">👩 قسم النساء</a>
      <a href="#">✨ وصل حديثاً</a>
      <a href="#">🔥 التخفيضات</a>
      <a href="#">📞 تواصل معنا</a>
    </div>

    <main class="container">
      <div class="checkout-container">
        <h2 class="section-title">بيانات الشحن والدفع</h2>
        <form>
          <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" placeholder="أدخل اسمك الثلاثي" required />
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" placeholder="01xxxxxxxxx" required />
          </div>
          <div class="form-group">
            <label>العنوان بالتفصيل</label>
            <input
              type="text"
              placeholder="المحافظة، المدينة، الشارع"
              required
            />
          </div>
          <button type="submit" class="btn" style="width: 100%">
            تأكيد الطلب
          </button>
        </form>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <div class="social-links">
          <a href="#" target="_blank" title="فيسبوك"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a href="#" target="_blank" title="إنستغرام"
            ><i class="fab fa-instagram"></i
          ></a>
          <a href="#" target="_blank" title="تويتر"
            ><i class="fab fa-twitter"></i
          ></a>
          <a href="#" target="_blank" title="واتساب"
            ><i class="fab fa-whatsapp"></i
          ></a>
        </div>
        <p>جميع الحقوق محفوظة © 2026</p>
      </div>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
