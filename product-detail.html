<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تيشيرت قطني عصري - متجر مودة</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta
      name="description"
      content="اشترِ تيشيرت قطني عصري 100% مريح جداً للاستخدام اليومي. متوفر بمقاسات وألوان متنوعة وبأفضل سعر."
    />
    <!-- JSON-LD for Product Details -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "PLACEHOLDER_PRODUCT_NAME",
        "image": ["PLACEHOLDER_PRODUCT_IMAGE"],
        "description": "PLACEHOLDER_PRODUCT_DESCRIPTION",
        "sku": "MODA-TSH-001",
        "brand": {
          "@type": "Brand",
          "name": "MODA"
        },
        "offers": {
          "@type": "Offer",
          "url": "PLACEHOLDER_PRODUCT_URL",
          "priceCurrency": "EGP",
          "price": "PLACEHOLDER_PRODUCT_PRICE",
          "priceValidUntil": "2026-12-31",
          "availability": "https://schema.org/InStock",
          "itemCondition": "https://schema.org/NewCondition"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "reviewCount": "24"
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .product-detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px;
        margin: 50px 0;
      }
      .product-info h1 {
        font-size: 32px;
        margin-bottom: 10px;
      }
      .options {
        margin: 20px 0;
      }
      .size-chips {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .size-btn {
        border: 1px solid #ddd;
        padding: 5px 15px;
        cursor: pointer;
      }
      .size-btn:hover {
        border-color: #000;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <button class="menu-toggle">☰</button>
        <div class="logo">MODA</div>
        <nav class="nav">
          <a href="index.html">الرئيسية</a><a href="products.html">المنتجات</a>
        </nav>
        <div class="header-actions">
          <button class="icon-btn">❤ <span id="wishlist-count">0</span></button>
        </div>
      </div>
    </header>

    <!-- Side Menu -->
    <div class="side-menu-overlay"></div>
    <div class="side-menu">
      <button class="close-menu">✕</button>
      <a href="index.html">🏠 الرئيسية</a>
      <a href="products.html">👕 كل المنتجات</a>
      <a href="products.html#mens-section">👨 قسم الرجال</a>
      <a href="products.html#womens-section">👩 قسم النساء</a>
      <a href="products.html?filter=new">✨ وصل حديثاً</a>
      <a href="#">🔥 التخفيضات</a>
      <a href="#">📞 تواصل معنا</a>
    </div>

    <main class="container">
      <div class="product-detail-grid">
        <div class="product-gallery">
          <img
            id="main-product-img"
            src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
            style="width: 100%; border-radius: 4px"
          />
        </div>
        <div class="product-info">
          <h1 id="main-product-name">تيشيرت قطني عصري</h1>
          <p
            id="main-product-category"
            style="color: #666; font-size: 14px; margin-bottom: 5px"
          >
            القسم: ملابس
          </p>
          <p id="main-product-price" class="price" style="font-size: 24px">
            350 جنيه
          </p>
          <p id="main-product-desc" style="color: #666">
            خامة قطنية 100% مريحة جداً للاستخدام اليومي، متوفر بألوان متعددة.
          </p>

          <div class="options">
            <h4>المقاس:</h4>
            <div class="size-chips" id="product-sizes-container">
              <!-- المقاسات سيتم تحميلها ديناميكياً هنا -->
            </div>
          </div>

          <div class="options">
            <h4>اللون:</h4>
            <div class="size-chips" id="product-colors-container">
              <!-- الألوان سيتم تحميلها ديناميكياً هنا -->
            </div>
          </div>

          <div style="display: flex; gap: 10px">
            <a href="cart.html" class="btn" style="flex: 1; text-align: center"
              >إضافة إلى السلة</a
            >
            <button
              id="detail-wishlist-btn"
              class="btn"
              style="
                background: #fff;
                color: var(--primary-color);
                border: 1px solid var(--primary-color);
                width: 60px;
              "
            >
              ❤
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Related Products Section -->
    <section class="container" style="margin-top: 60px">
      <h2 class="section-title">منتجات قد تعجبك</h2>
      <div id="related-products-grid" class="product-grid">
        <!-- سيتم توليد المنتجات هنا بواسطة JavaScript -->
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="social-links">
          <a href="#" target="_blank" title="فيسبوك"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a href="#" target="_blank" title="إنستغرام"
            ><i class="fab fa-instagram"></i
          ></a>
          <a href="#" target="_blank" title="تويتر"
            ><i class="fab fa-twitter"></i
          ></a>
          <a href="#" target="_blank" title="واتساب"
            ><i class="fab fa-whatsapp"></i
          ></a>
        </div>
        <p>جميع الحقوق محفوظة © 2026</p>
      </div>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
